<!DOCTYPE html>
<html lang="en">

<head>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.13/lib/p5.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.13/lib/addons/p5.sound.min.js"></script>
  <meta charset="utf-8" />
  <style>
    html {
      background-color: black;
    }

    img {
      position: absolute;
    }


    svg {
      overflow: visible;
      /* display: block; */

      width: auto;
      height: auto;
    }

    .score-container {
      position: absolute;
      /* display: block; */
      display: inline-block;
      width: fit-content;
      height: fit-content;
      overflow: visible;
    }

    .score-container svg {
      height: 6.5rem;
      width: auto;
      fill: #B1FCCF;
      stroke: #B1FCCF;
      color: #B1FCCF;
      display: block;
      overflow: visible;
    }

    .score-container svg {
      pointer-events: none;
    }

    .score-container svg * {
      pointer-events: auto;
    }

    Ï img {
      max-width: none;
    }
  </style>
</head>

<body>
  <main id="main"></main>
  <img src="img/logo.webp" width="700px" style="top: 1545px;left: 90px;">

  <script type="module">

    import { nodes } from './metadata.js';
    let pianoKey;
    let sounds = {};

    window.preload = function () {
      soundFormats("wav", "mp3");
      pianoKey = loadSound("/assets/ffvii-key.wav");
      nodes.forEach((n, i) => {
        n.connections.forEach((c, j) => {
          const soundFilename = n.id + "_" + c;
          console.log(`${soundFilename}.mp3`);
          sounds[soundFilename] = loadSound(`/audio/${soundFilename}.mp3`);
        })
      })
      console.log("preload");
    };

    window.setup = function () {
      createCanvas(1, 1); // can even be minimal
    };

    const mainColour = "#B1FCCF"
    const parser = new DOMParser();
    let score_xml = {};
    let score_svg = {};
    const allPromises = [];

    const mainEl = document.getElementById("main");
    const backgroundContainer = document.createElement("div");
    backgroundContainer.className = "background";
    backgroundContainer.id = "backgroundDiv";
    backgroundContainer.style.position = "absolute"
    backgroundContainer.style.left = `10px`;
    backgroundContainer.style.top = `10px`;
    mainEl.appendChild(backgroundContainer);

    let backgroundSvg;
    allPromises.push(fetch(`./background-text.svg`)
      .then(res => res.text())
      .then(svg => {
        const doc = parser.parseFromString(svg, "image/svg+xml");
        backgroundSvg = doc.querySelector("svg");
        backgroundContainer.appendChild(backgroundSvg);
        // addNodes(backgroundSvg);
      }))


    let N = 1 / 0.424;

    let attack = 0.001;
    let decay = 0.05;
    let sustain = 0.707;
    let release = 1.75;
    let gain = .707;

    let osc = new p5.Oscillator();
    osc.freq(midi2Hz(64));

    let env = new p5.Envelope(attack, gain, decay, gain);
    env.setADSR(attack, decay, sustain, release);
    env.setRange(gain, 0);
    env.setExp(false);


    let positions = {
      aerith_1: { x: 310, y: 1419 },
      aerith_2: { x: 804, y: 1228 },
      barret_1: { x: 1219, y: 396 },
      bombing_mission_1: { x: 2308, y: 1547 },
      chocobo_1: { x: 2537, y: 127 },
      cid_1: { x: 1146, y: 1575 },
      fanfare_1: { x: 3068, y: 1426 },
      fighting_1: { x: 2995, y: 566 },
      fighting_2: { x: 2582, y: 844 },
      fighting_3: { x: 3000, y: 872 },
      fighting_4: { x: 3245, y: 1195 },
      lifestream_1: { x: 1820, y: 1191 },
      lifestream_2: { x: 2268, y: 1191 },
      main_theme_1: { x: 1733, y: 405 },
      oppressed_people_1: { x: 2278, y: 1806 },
      oppressed_people_2: { x: 2780, y: 1806 },
      prelude_1: { x: 648, y: 287 },
      prelude_2: { x: 422, y: 384 },
      prelude_3: { x: 429, y: 820 },
      red_xiii_1: { x: 1528, y: 1509 },
      red_xiii_2: { x: 1735, y: 1509 },
      tifa_1: { x: 1372, y: 851 },
      yuffie_1: { x: 509, y: 1016 }
    }

    const scores = [
      'aerith_1',
      'aerith_2',
      'barret_1',
      'bombing_mission_1',
      'chocobo_1',
      'cid_1',
      'fanfare_1',
      'fighting_1',
      'fighting_2',
      'fighting_3',
      'fighting_4',
      'lifestream_1',
      'lifestream_2',
      'main_theme_1',
      'oppressed_people_1',
      'oppressed_people_2',
      'prelude_1',
      'prelude_2',
      'prelude_3',
      'red_xiii_1',
      'red_xiii_2',
      'tifa_1',
      'yuffie_1',
    ]

    scores.forEach(score_file => {

      const container = document.createElement("div");
      container.className = "score-container";
      container.id = score_file;
      container.style.left = `${positions[score_file].x}px`;
      container.style.top = `${positions[score_file].y}px`;
      container.style.transform = "translate(-50%, -50%)";
      document.getElementById("main").appendChild(container);

      allPromises.push(fetch(`xml/${score_file}.musicxml`)
        .then(res => res.text())
        .then(xml => {
          score_xml[score_file] = parser.parseFromString(xml, "text/xml");
        }));

      allPromises.push(fetch(`svg/${score_file}.svg`)
        .then(res => res.text())
        .then(svg => {
          const doc = parser.parseFromString(svg, "image/svg+xml");
          const svgDom = doc.querySelector("svg");
          const staffElements = svgDom.querySelector(".layer");
          const notes = staffElements.querySelectorAll(".note,.rest");

          score_svg[score_file] = notes

          notes.forEach((note, ni) => {
            note.addEventListener("mouseover", () => {
              note.style.fill = "orange";
            });

            note.addEventListener("mousedown", () => {
              const containerSvg = note.closest(".score-container");
              let noteData = score_xml[containerSvg.id].querySelectorAll('note')[ni];

              if (noteData.querySelector('rest')) {
                return
              }
              else {
                const step = noteData.querySelector('step').textContent;
                const octave = Number(noteData.querySelector('octave').textContent);
                note.style.fill = "red";

                // osc.freq(midi2Hz(xmlPitch2Midi(noteData)));
                // osc.start();
                // env.play(osc);
                playKey(xmlPitch2Transpose(noteData));
              }
            });

            note.addEventListener("mouseout", () => {
              note.style.fill = mainColour;
            });

          });

          const clef = svgDom.querySelector(".clef");

          clef.addEventListener("mouseover", () => {
            clef.style.fill = "orange";
          });

          clef.addEventListener("mousedown", () => {
            osc.freq(0);
            osc.start();
            env.play(osc);
            const containerSvg = clef.closest(".score-container");
            const themeId = containerSvg.id;
            playTheme(themeId);
            clef.style.fill = "red";
          });


          clef.addEventListener("mouseout", () => {
            clef.style.fill = mainColour;
          });

          document.getElementById(score_file).appendChild(svgDom);
          const outer = svgDom;
          const inner = outer.querySelector("svg.definition-scale");

          // Move children out
          while (inner.firstChild) {
            outer.appendChild(inner.firstChild);
          }
          // Copy important attrs
          if (inner.hasAttribute("viewBox")) {
            outer.setAttribute("viewBox", inner.getAttribute("viewBox"));
          }

          // Remove nested svg
          inner.remove();

          // Remove fixed dimensions
          outer.removeAttribute("width");
          outer.removeAttribute("height");
        }));
    })

    Promise.all(allPromises).then(() => {
      addNodes(backgroundSvg)
    });


    function xmlPitch2Midi(noteXml) {
      const step = noteXml.querySelector('step').textContent;
      const octave = Number(noteXml.querySelector('octave').textContent);
      let midiNote = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11, }[step] + (2 + octave) * 12
      let acc = noteXml.querySelector('accidental')
      if (acc) { // check no parentheses
        if (acc.textContent === 'flat')
          midiNote--;
        else if (acc.textContent === 'sharp')
          midiNote++;
      }
      let alter = noteXml.querySelector('alter')
      if (alter)
        midiNote += Number(alter.textContent)

      return midiNote
    }


    function midi2Hz(midiNoteNumber) {
      return Math.pow(2, (midiNoteNumber - 69) / 12.0) * 440.0;
    }

    function xmlPitch2Freq(noteXml) {
      return midi2Hz(xmlPitch2Midi(noteXml));
    }

    function playTheme(themeId) {
      let noteData = score_xml[themeId].querySelectorAll('note');
      let eventTime = 0.05;
      const bpm = Number(score_xml[themeId].querySelector("sound").getAttribute('tempo'))
      // milliseconds per 16th note
      const msp16 = 1000 * 60 / (4 * bpm)
      const isSwing = (score_xml[themeId].querySelector("sound").getAttribute('swing')) ? true : false;

      let eigthBeat = 0;

      for (let n = 0; n < noteData.length; n++) {
        const isRest = (noteData[n].querySelector('rest')) ? true : false;
        const isTied = noteData[n].querySelector("tied") ? true : false;
        const isTriplet = noteData[n].querySelector("time-modification") ? true : false;
        const isEndTie = (isTied && noteData[n].querySelector("tied").getAttribute('type') === 'stop')
        const isDotted = (noteData[n].querySelector('dot')) ? true : false;

        const noteType = noteData[n].querySelector('type').textContent;
        const dur = type2duration(noteData[n].querySelector('type').textContent) * ((isDotted) ? 1.5 : 1.0) * ((isTriplet) ? 0.666 : 1.0);

        let swingMult = 1;
        if (isSwing) {
          if (eigthBeat % 2)
            swingMult = 0.333;
          else
            swingMult = 0.6666;
        }

        let timeDelta = swingMult * dur * msp16;

        setTimeout(() => {
          score_svg[themeId][n].style.fill = "orange"

          if (!isRest && !isEndTie) {
            playKey(xmlPitch2Transpose(noteData[n]))
            // osc.freq(xmlPitch2Freq(noteData[n]));
            // env.play(osc);
          }
        }, eventTime)
        eventTime += timeDelta;
        eigthBeat += dur / 2;
      }
      setTimeout(() => {
        score_svg[themeId].forEach(note => {
          note.style.fill = mainColour;
        })
      }, eventTime + 500)
    }


    function type2duration(noteType) {
      return {
        "whole": 16,
        "half": 8,
        "quarter": 4,
        "eighth": 2,
        "16th": 1,
      }[noteType]
    }

    function xmlPitch2Transpose(noteXml) {
      const step = noteXml.querySelector('step').textContent;
      const octave = Number(noteXml.querySelector('octave').textContent);
      let transpose = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11, }[step] + ((octave - 4) * 12);
      let acc = noteXml.querySelector('accidental')
      if (acc) {
        if (acc.textContent === 'flat')
          transpose--;
        else if (acc.textContent === 'sharp')
          transpose++;
      }
      let alter = noteXml.querySelector('alter')
      if (alter)
        transpose += Number(alter.textContent)

      return transpose
    }

    function semitonesToRate(semitones) {
      return Math.pow(2, semitones / 12);
    }

    function playKey(transpose) {
      pianoKey.stop();     // restart cleanly
      pianoKey.rate(semitonesToRate(transpose)); // playback speed + pitch
      pianoKey.play();
    }

    // Drawing Nodes
    function drawNode(node, backgroundSvg) {
      const font_size = 22.5;
      const g = document.createElementNS("http://www.w3.org/2000/svg", "g");

      const circle = document.createElementNS(backgroundSvg.namespaceURI, "circle");
      circle.setAttribute("cx", node.x);
      circle.setAttribute("cy", node.y);
      circle.setAttribute("r", 70);
      circle.setAttribute("fill", mainColour);
      circle.setAttribute("class", node.id);

      // hover detection
      circle.addEventListener("mouseenter", () => {
        circle.setAttribute("fill", "orange");
        backgroundSvg.querySelectorAll(`.${node.id}_line`).forEach((line) => {
          line.setAttribute('stroke', 'orange')
        })
      });

      circle.addEventListener("mouseleave", () => {
        circle.setAttribute("fill", mainColour);
        backgroundSvg.querySelectorAll(`.${node.id}_line`).forEach((line) => {
          line.setAttribute('stroke', mainColour)
        })
      });

      g.appendChild(circle);

      if (node.text.includes("\n")) {
        const lines = node.text.split("\n")

        const count = lines.length;
        if (count === 2) {
          lines.forEach((line, i) => {
            const text = document.createElementNS(backgroundSvg.namespaceURI, "text");
            const offset = -5 + (i * font_size * 1.4);
            text.setAttribute("transform", `translate(0, ${offset}) scale(0.56, 1)`);
            text.setAttribute("x", node.x / 0.56);
            text.setAttribute("y", node.y);
            text.setAttribute("text-anchor", "middle");
            text.setAttribute("class", ".node-text");
            text.setAttribute("font-size", `${font_size}pt`);
            text.setAttribute("fill", "#000");
            text.textContent = line;
            g.appendChild(text);
          })
        }
        else {
          lines.forEach((line, i) => {
            const text = document.createElementNS(backgroundSvg.namespaceURI, "text");
            const offset = 10 + font_size * 1.4 * (i - 1);
            text.setAttribute("transform", `translate(0, ${offset}) scale(0.56, 1)`);
            text.setAttribute("x", node.x / 0.56);
            text.setAttribute("y", node.y);
            text.setAttribute("text-anchor", "middle");
            text.setAttribute("class", ".node-text");
            text.setAttribute("font-size", `${font_size}pt`);
            text.setAttribute("fill", "#000");
            text.textContent = line;
            g.appendChild(text);
          })
        }
      }
      else {
        const text = document.createElementNS(backgroundSvg.namespaceURI, "text");

        text.setAttribute("transform", "translate(0, 5) scale(0.56, 1)");
        text.setAttribute("x", node.x / 0.56);
        text.setAttribute("y", node.y + 5);
        text.setAttribute("text-anchor", "middle");
        text.setAttribute("class", ".node-text");
        text.setAttribute("font-size", `${font_size}pt`);
        text.setAttribute("fill", "#000");
        text.textContent = node.text;
        g.appendChild(text);
      }
      // g.appendChild(scaleText);
      backgroundSvg.appendChild(g);
    }

    function drawArrow(node, backgroundSvg) {
      node.connections.forEach((scoreId, i) => {
        const score = positions[scoreId];
        const line = document.createElementNS(backgroundSvg.namespaceURI, "line");
        const el = document.getElementById(scoreId);
        const scaleWidth = 1.0;
        const scaleHeight = 0.9;
        const end = getArrowEndPoint(node.x, node.y, score.x, score.y, el.offsetWidth * scaleWidth, el.offsetHeight * scaleHeight);

        line.setAttribute("x1", node.x);
        line.setAttribute("y1", node.y);
        line.setAttribute("x2", end.x);
        line.setAttribute("y2", end.y);
        line.setAttribute("stroke", mainColour);
        line.setAttribute("stroke-width", "5");
        line.setAttribute("marker-end", "url(#arrowhead)");
        line.setAttribute("class", `${node.id}_line`);
        const line_id = node.id + "_" + scoreId;
        line.setAttribute("line-id", line_id);
        line.addEventListener("mouseenter", () => {
          line.setAttribute("stroke", "orange");
          backgroundSvg.querySelector(`.${node.id}`).setAttribute("fill", "orange")
        });

        line.addEventListener("mouseleave", () => {
          // if track playing, skip this
          line.setAttribute("stroke", mainColour);
          backgroundSvg.querySelector(`.${node.id}`).setAttribute("fill", mainColour)
        });

        line.addEventListener("mousedown", () => {
          // play
          console.log(`Play Sound: ${line_id}`)
          console.log(sounds[line_id]);
          sounds[line_id].play()
          line.setAttribute("stroke", "red");
          backgroundSvg.querySelector(`.${node.id}`).setAttribute("fill", "red")
        });

        backgroundSvg.appendChild(line);
      })
    }

    function addNodes(backgroundSvg) {
      console.log("addNodes()")
      nodes.forEach(node => drawArrow(node, backgroundSvg))
      nodes.forEach(node => drawNode(node, backgroundSvg))
    }


    function getArrowEndPoint(
      cx, cy,           // source circle center
      tx, ty,           // target center
      width, height,    // target size
      margin = 0
    ) {
      // Direction vector
      const dx = tx - cx;
      const dy = ty - cy;

      // Length
      const len = Math.hypot(dx, dy);

      // Unit vector
      const ux = dx / len;
      const uy = dy / len;

      // Half dimensions
      // 450/688 of width
      const hw = width * 0.5 * ((dx < 0) ? 1.15 : 1.4);
      const hh = height * 0.5 * ((dy < 0) ? 0.85 : 1.5);

      // Distance to rectangle edge along ray
      const scaleX = hw / Math.abs(ux);
      const scaleY = hh / Math.abs(uy);

      // Closest edge intersection
      const edgeDist = Math.min(scaleX, scaleY);

      // Pull back by edge + margin
      const dist = edgeDist + margin;

      return {
        x: tx - ux * dist,
        y: ty - uy * dist
      };
    }

    function stopAllSounds() {

      for (const [key, sound] of Object.entries(sounds)) {
        sound.stop();
      }

    }

  </script>
</body>

</html>
