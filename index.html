          const svgDom = doc.querySelector("svg");
          const notes = svgDom.querySelectorAll(".note");


          notes.forEach((note, ni) => {


            note.addEventListener("mousedown", () => {
              console.log("clicked", note.id, ni);
              note.style.fill = "red";
            });


            note.addEventListener("mouseup", () => {              
              note.style.fill = "black";
            });

          });

          document.getElementById("container").appendChild(svgDom);          
        });
